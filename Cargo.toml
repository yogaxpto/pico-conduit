[workspace]
members = [".", "client", "macros"]
resolver = "2"

[package]
name = "pico-socketeer"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The `embedded` feature gates the binary target (src/main.rs) which requires
# embassy, cyw43, and other Cortex-M-only crates. Host tests pass --no-default-features
# so the binary is silently skipped.
[features]
default = ["embedded", "pico2w", "transport-tcp"]
embedded = []
pico2w = ["embassy-rp/rp235xa"]
pico1w = ["embassy-rp/rp2040"]
transport-tcp = []
transport-websocket = []
transport-mqtt = ["dep:rust-mqtt"]
# Optional binary codec — uses postcard's compact binary format instead of JSON.
# Evaluated over rmp-serde (requires alloc) and minicbor (no serde integration).
# Mutually exclusive with future codec-cbor; currently the only binary codec option.
codec-postcard = ["dep:postcard"]

[[bin]]
name = "pico-socketeer"
path = "src/main.rs"
required-features = ["embedded"]

# ── Library deps (host + embedded) ──────────────────────────────────────────
# These compile for both the embedded target AND the host test runner.
# Keep this list lean: only crates whose public API is used by src/lib.rs modules.

[dependencies]
# JSON protocol (no_std, no heap)
serde           = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

# Fixed-capacity data structures (no heap)
heapless = { version = "0.9.2", features = ["serde"] }

# Structured logging — host-compatible facade (macros become no-ops on host)
defmt = "1.0.1"

# Embedded HAL traits — pure interfaces, compile everywhere
embedded-hal       = "1.0"
embedded-hal-async = "1.0"
embedded-io-async  = "0.7.0"

# Flash storage traits (needed by sequential-storage API surface)
embedded-storage = "0.3"

# Required by heapless on platforms without native 64-bit atomics.
# On aarch64 the native atomics are used; the crate still compiles fine.
portable-atomic = { version = "1.5", features = ["critical-section"] }

# Fixed-point arithmetic — provides FixedU32<U8> used for CYW43 SPI clock divider.
# no_std compatible; compiles on both the embedded target and the host test runner.
fixed = { version = "1", default-features = false }

# Binary codec (optional, no_std, no-alloc).
# Enabled by the `codec-postcard` feature. Evaluated alternatives:
#   rmp-serde: MessagePack with serde — requires alloc, not viable for no_std.
#   minicbor: CBOR format — no_std but uses its own derive macros, not serde-compatible.
#   postcard: compact binary format, excellent no_std + no-alloc support, serde-compatible.
postcard = { version = "1", default-features = false, optional = true }

# ── Embedded-only deps ───────────────────────────────────────────────────────
# Gated to `target_os = "none"` so they are NEVER compiled during host tests.
# All deps that require Cortex-M, RTT, PIO, or board-specific hardware go here.

[target.'cfg(target_os = "none")'.dependencies]
# Embassy async runtime and RP HAL (chip variant selected by pico2w/pico1w feature)
embassy-rp = { version = "0.9.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "binary-info",
] }
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time    = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync    = { version = "0.8.0", features = ["defmt"] }
embassy-net     = { version = "0.9.0", features = [
    "defmt",
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "dns",
] }
embassy-futures = "0.1.1"

# MQTT client (async, no_std, uses embedded-io-async directly — no adapter needed)
rust-mqtt = { version = "0.4.1", default-features = false, features = ["v5", "bump", "defmt"], optional = true }

# CYW43439 Wi-Fi driver (Pico 2W onboard chip)
cyw43     = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.9.0", features = ["defmt"] }

# Panic handler — RTT-backed (replaces panic-halt)
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# RTT logger transport (probe-rs reads via SWD)
defmt-rtt = "1.0.0"

# Static allocation helper (requires embedded linker sections)
static_cell = "2.1"

# Wear-levelled flash key-value storage (credentials)
sequential-storage = "7.2.0"

# `#[embassy_executor::main]` expands to `#[cortex_m_rt::entry]` — must be a direct dep
cortex-m-rt = "0.7"

# ── Dev dependencies (host test runner only) ─────────────────────────────────

[dev-dependencies]
# Mock peripheral implementations for Tier 2 host tests
# NEVER linked into the firmware binary — dev-dependency only
embedded-hal-mock = { version = "0.11.1", features = ["embedded-hal-async", "eh1"] }
# heapless is a [dependencies] entry but tests in tests/ are separate crates; re-declare here
heapless = { version = "0.9.2", features = ["serde"] }
# JSON construction/parsing for Tier 4 integration tests
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
# Proc-macro test helpers (e.g. #[require_env("PICO_IP")])
pico-socketeer-macros = { path = "macros" }
sha1 = "0.10"

[[test]]
name = "host"
path = "tests/host/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[profile.release]
opt-level     = "s"      # optimise for binary size
lto           = true     # link-time optimisation; reduces firmware size significantly
codegen-units = 1        # required for LTO; disables parallel codegen
debug         = true     # retain symbols so probe-rs / defmt can decode RTT log messages
panic         = "abort"  # no unwinding tables; panic-probe halts anyway

[profile.dev]
opt-level = "s"
debug     = true
