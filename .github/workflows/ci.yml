name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Fast checks (run in parallel) ──────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install flip-link
        run: cargo install flip-link --locked

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (embedded firmware)
        run: cargo clippy --target thumbv8m.main-none-eabihf -- -D warnings

      - name: Clippy (client crate)
        run: cargo clippy -p pico-socketeer-client --target x86_64-unknown-linux-gnu -- -D warnings

  host-test:
    name: Host Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Host tests (Tier 1 + 2)
        run: cargo test --test host --no-default-features --target x86_64-unknown-linux-gnu

      - name: Client crate tests
        run: cargo test -p pico-socketeer-client --target x86_64-unknown-linux-gnu

  # ── Firmware build (gates on lint + tests passing) ─────────────────
  build-firmware:
    name: Build Firmware
    needs: [lint, host-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install flip-link
        run: cargo install flip-link --locked

      - name: Build firmware (release)
        run: cargo build --release --target thumbv8m.main-none-eabihf

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-elf
          path: target/thumbv8m.main-none-eabihf/release/pico-socketeer
          retention-days: 5

  # ── Release (only on version tags) ─────────────────────────────────
  release:
    name: Release UF2
    needs: build-firmware
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-elf

      - name: Install elf2uf2-rs
        run: cargo install elf2uf2-rs --locked

      - name: Convert ELF to UF2
        run: elf2uf2-rs pico-socketeer pico-socketeer.uf2

      - name: Upload UF2 to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pico-socketeer.uf2
