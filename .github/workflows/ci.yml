name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: /cache/target

jobs:
  # ── Build CI Docker image (pre-compiled deps for downstream jobs) ───
  build:
    name: Build CI Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}/ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ci:${{ github.sha }}
            ghcr.io/${{ github.repository }}/ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Fast checks (run in parallel after build) ─────────────────────
  lint:
    name: Lint (${{ matrix.board }})
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - board: pico2w
            target: thumbv8m.main-none-eabihf
            cargo-features: ""
          - board: pico1w
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w"
    steps:
      - uses: actions/checkout@v6

      - name: Resolve host target
        id: host
        run: |
          echo "triple=$(rustc -vV | sed -n 's/host: //p')" >> "$GITHUB_OUTPUT"

      - name: Format check
        if: matrix.board == 'pico2w'
        run: cargo fmt --all --check

      - name: Clippy (embedded firmware)
        run: cargo clippy --release --target ${{ matrix.target }} ${{ matrix.cargo-features }} -- -D warnings

      - name: Clippy (client crate)
        if: matrix.board == 'pico2w'
        run: cargo clippy -p pico-socketeer-client --target ${{ steps.host.outputs.triple }} -- -D warnings

  host-test:
    name: Test (${{ matrix.board }})
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - board: pico2w
            cargo-features: "--features pico2w"
          - board: pico1w
            cargo-features: "--features pico1w"
    steps:
      - uses: actions/checkout@v6

      - name: Resolve host target
        id: host
        run: |
          echo "triple=$(rustc -vV | sed -n 's/host: //p')" >> "$GITHUB_OUTPUT"

      - name: Host tests (board-independent)
        if: matrix.board == 'pico2w'
        run: cargo test --test host --no-default-features --target ${{ steps.host.outputs.triple }}

      - name: Board-specific tests (${{ matrix.board }})
        run: cargo test --test host --no-default-features ${{ matrix.cargo-features }} --target ${{ steps.host.outputs.triple }}

      - name: Client crate tests
        if: matrix.board == 'pico2w'
        run: cargo test -p pico-socketeer-client --target ${{ steps.host.outputs.triple }}

  # ── Firmware build (gates on lint + tests passing) ─────────────────
  build-firmware:
    name: Build Firmware (${{ matrix.board }})
    needs: [build, lint, host-test]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        include:
          - board: pico2w
            target: thumbv8m.main-none-eabihf
            cargo-features: ""
            flash-max: 4186112
            flash-desc: "4 MB"
          - board: pico1w
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w"
            flash-max: 2088960
            flash-desc: "2 MB"
    steps:
      - uses: actions/checkout@v6

      - name: Build firmware (release)
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo-features }}

      - name: Verify firmware fits in flash
        run: |
          FLASH_MAX=${{ matrix.flash-max }}

          FIRMWARE=${CARGO_TARGET_DIR}/${{ matrix.target }}/release/pico-socketeer
          TEXT=$(size "$FIRMWARE" | awk 'NR==2 {print $1}')
          DATA=$(size "$FIRMWARE" | awk 'NR==2 {print $2}')
          USED=$(( TEXT + DATA ))

          echo "Flash budget : ${FLASH_MAX} bytes (${{ matrix.flash-desc }} − 8 KB credentials)"
          echo "Firmware size: ${USED} bytes  (text=${TEXT}, data=${DATA})"
          echo "Remaining    : $(( FLASH_MAX - USED )) bytes"

          if [ "$USED" -gt "$FLASH_MAX" ]; then
            echo "FAIL: firmware exceeds flash capacity by $(( USED - FLASH_MAX )) bytes"
            exit 1
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-elf-${{ matrix.board }}
          path: /cache/target/${{ matrix.target }}/release/pico-socketeer
          retention-days: 5

  # ── Release (only on version tags) ─────────────────────────────────
  release:
    name: Release UF2
    needs: build-firmware
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-elf-pico2w

      - uses: cargo-bins/cargo-binstall@v1.17.6
      - name: Install elf2uf2-rs
        run: cargo binstall elf2uf2-rs --no-confirm --locked

      - name: Convert ELF to UF2
        run: elf2uf2-rs pico-socketeer pico-socketeer.uf2

      - name: Upload UF2 to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pico-socketeer.uf2
