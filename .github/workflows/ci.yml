name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: /cache/target
  # Injected at runtime by the Actions runner; declared here to satisfy
  # IDE linters that validate env context references.
  ACTIONS_CACHE_URL: ""
  ACTIONS_RUNTIME_TOKEN: ""

jobs:
  # ── Build CI Docker image: pico2w variant (thumbv8m + host deps) ────
  # The image is tagged by a content hash of all dependency-relevant files.
  # If the hash-tagged image already exists in GHCR the build is skipped,
  # saving ~3-5 min on source-only pushes.
  build-pico2w:
    name: Build CI Image (pico2w)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute deps hash
        id: deps-hash
        run: |
          HASH=$(cat \
            Cargo.toml Cargo.lock build.rs \
            client/Cargo.toml macros/Cargo.toml \
            rust-toolchain.toml \
            .cargo/config.toml \
            memory-pico2w.x memory-pico1w.x \
            .github/Dockerfile.ci \
            | sha256sum | cut -c1-16)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if deps image exists
        id: check
        run: |
          TAG="deps-pico2w-${{ steps.deps-hash.outputs.hash }}"
          IMAGE="ghcr.io/${{ github.repository }}/ci:${TAG}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Expose GHA cache service URL/token so sccache inside BuildKit can
      # read/write the Actions cache.  actions/cache injects these env vars
      # automatically; buildx needs them forwarded as build secrets.
      - name: Expose GitHub Actions cache env
        if: steps.check.outputs.exists == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.exists == 'false'
        with:
          context: .
          file: .github/Dockerfile.ci
          target: final-pico2w
          push: true
          tags: |
            ${{ steps.check.outputs.image }}
            ${{ github.ref == 'refs/heads/master' && format('ghcr.io/{0}/ci:latest', github.repository) || '' }}
          cache-from: type=gha,scope=pico2w
          cache-to: type=gha,mode=max,scope=pico2w
          secrets: |
            actions_cache_url=${{ env.ACTIONS_CACHE_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}

      - name: Tag as latest (skip path)
        if: |
          steps.check.outputs.exists == 'true'
          && github.ref == 'refs/heads/master'
        run: |
          docker buildx imagetools create \
            ${{ steps.check.outputs.image }} \
            --tag ghcr.io/${{ github.repository }}/ci:latest

  # ── Build CI Docker image: pico1w variant (thumbv6m deps only) ──────
  # Runs in parallel with build-pico2w on a separate runner, halving the
  # wall time spent in the image-build phase.  Skipped when the content-
  # hash-tagged image already exists in GHCR.
  build-pico1w:
    name: Build CI Image (pico1w)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute deps hash
        id: deps-hash
        run: |
          HASH=$(cat \
            Cargo.toml Cargo.lock build.rs \
            client/Cargo.toml macros/Cargo.toml \
            rust-toolchain.toml \
            .cargo/config.toml \
            memory-pico2w.x memory-pico1w.x \
            .github/Dockerfile.ci \
            | sha256sum | cut -c1-16)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if deps image exists
        id: check
        run: |
          TAG="deps-pico1w-${{ steps.deps-hash.outputs.hash }}"
          IMAGE="ghcr.io/${{ github.repository }}/ci:${TAG}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Expose GitHub Actions cache env
        if: steps.check.outputs.exists == 'false'
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - uses: docker/build-push-action@v7
        if: steps.check.outputs.exists == 'false'
        with:
          context: .
          file: .github/Dockerfile.ci
          target: final-pico1w
          push: true
          tags: ${{ steps.check.outputs.image }}
          cache-from: type=gha,scope=pico1w
          cache-to: type=gha,mode=max,scope=pico1w
          secrets: |
            actions_cache_url=${{ env.ACTIONS_CACHE_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}

  # ── Host test binary compilation: pico2w board ────────────────────
  # Compiles board-agnostic + pico2w + client host test binaries.
  # Runs in parallel with host-build-pico1w on a separate runner, so
  # host-test-pico2w no longer waits for the pico1w compilation.
  host-build-pico2w:
    name: Build host test binaries (pico2w)
    needs: [build-pico2w]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}/ci:host-pico2w-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile.ci.host
          target: host-pico2w
          push: true
          tags: ghcr.io/${{ github.repository }}/ci:host-pico2w-${{ github.sha }}
          build-args: DEPS_IMAGE=${{ needs.build-pico2w.outputs.image }}
          cache-from: type=gha,scope=host-pico2w
          cache-to: type=gha,mode=max,scope=host-pico2w

  # ── Host test binary compilation: pico1w board ────────────────────
  # Compiles only the pico1w host test binary.
  # Both host-build-* jobs use the pico2w deps image as DEPS_IMAGE because
  # the host toolchain lives there; the board flag is a Cargo feature only.
  host-build-pico1w:
    name: Build host test binaries (pico1w)
    needs: [build-pico2w]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}/ci:host-pico1w-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile.ci.host
          target: host-pico1w
          push: true
          tags: ghcr.io/${{ github.repository }}/ci:host-pico1w-${{ github.sha }}
          build-args: DEPS_IMAGE=${{ needs.build-pico2w.outputs.image }}
          cache-from: type=gha,scope=host-pico1w
          cache-to: type=gha,mode=max,scope=host-pico1w

  # ── Fast checks: pico2w variants ─────────────────────────────────
  # Starts as soon as build-pico2w is ready — does not wait for build-pico1w.
  lint-pico2w:
    name: Lint (${{ matrix.board }})
    needs: [build-pico2w]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-pico2w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico2w
            target: thumbv8m.main-none-eabihf
            cargo-features: ""
          - board: pico2w-ws
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-websocket"
          - board: pico2w-mqtt
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-mqtt"
          - board: pico2w-postcard
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-tcp,codec-postcard"
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve host target
        id: host
        run: |
          . /etc/cargo-env
          echo "triple=${HOST_TRIPLE}" >> "$GITHUB_OUTPUT"

      - name: Start sccache or disable
        run: sccache --start-server 2>/dev/null || echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Format check
        if: matrix.board == 'pico2w'
        run: cargo fmt --all --check

      - name: Transport exclusivity guard
        if: matrix.board == 'pico2w'
        run: |
          out=$(cargo check --no-default-features \
            --features embedded,pico2w,transport-tcp,transport-websocket 2>&1) || true
          echo "$out" | grep -q "mutually exclusive"
          out=$(cargo check --no-default-features \
            --features embedded,pico2w,transport-tcp,transport-mqtt 2>&1) || true
          echo "$out" | grep -q "mutually exclusive"
          out=$(cargo check --no-default-features \
            --features embedded,pico2w,transport-websocket,transport-mqtt 2>&1) || true
          echo "$out" | grep -q "mutually exclusive"

      - name: Clippy (embedded firmware)
        run: cargo clippy --release --target ${{ matrix.target }} ${{ matrix.cargo-features }} -- -D warnings

      - name: Clippy (client crate)
        if: matrix.board == 'pico2w'
        run: cargo clippy -p pico-socketeer-client --target ${{ steps.host.outputs.triple }} -- -D warnings

  # ── Fast checks: pico1w variants ─────────────────────────────────
  # Starts as soon as build-pico1w is ready — does not wait for build-pico2w.
  lint-pico1w:
    name: Lint (${{ matrix.board }})
    needs: [build-pico1w]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-pico1w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico1w
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-tcp"
          - board: pico1w-ws
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-websocket"
          - board: pico1w-mqtt
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-mqtt"
          - board: pico1w-postcard
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-tcp,codec-postcard"
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - name: Start sccache or disable
        run: sccache --start-server 2>/dev/null || echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Clippy (embedded firmware)
        run: cargo clippy --release --target ${{ matrix.target }} ${{ matrix.cargo-features }} -- -D warnings

  # ── Host tests: pico2w board ──────────────────────────────────────
  host-test-pico2w:
    name: Test (pico2w)
    needs: [host-build-pico2w]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.host-build-pico2w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: /src
    steps:
      - name: Resolve host target
        id: host
        run: |
          . /etc/cargo-env
          echo "triple=${HOST_TRIPLE}" >> "$GITHUB_OUTPUT"

      - name: Host tests (board-independent)
        run: cargo test --test host --no-default-features --target ${{ steps.host.outputs.triple }}

      - name: Board-specific tests (pico2w)
        run: cargo test --test host --no-default-features --features pico2w --target ${{ steps.host.outputs.triple }}

      - name: Client crate tests
        run: cargo test -p pico-socketeer-client --target ${{ steps.host.outputs.triple }}

  # ── Host tests: pico1w board ──────────────────────────────────────
  host-test-pico1w:
    name: Test (pico1w)
    needs: [host-build-pico1w]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.host-build-pico1w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: /src
    steps:
      - name: Resolve host target
        id: host
        run: |
          . /etc/cargo-env
          echo "triple=${HOST_TRIPLE}" >> "$GITHUB_OUTPUT"

      - name: Board-specific tests (pico1w)
        run: cargo test --test host --no-default-features --features pico1w --target ${{ steps.host.outputs.triple }}

  # ── Firmware build (gates on lint + tests passing) ─────────────────
  # Source is not pre-compiled in the deps image; cargo build --release here
  # does the full LTO compilation. Eight matrix items run in parallel, each on
  # a dedicated runner.
  build-firmware:
    name: Build Firmware (${{ matrix.board }})
    needs: [build-pico2w, build-pico1w, lint-pico2w, lint-pico1w, host-test-pico2w, host-test-pico1w]
    runs-on: ubuntu-latest
    container:
      image: >-
        ${{ matrix.pico1w == true
            && needs.build-pico1w.outputs.image
            || needs.build-pico2w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico2w
            target: thumbv8m.main-none-eabihf
            cargo-features: ""
            flash-max: 4186112
            flash-desc: "4 MB"
            pico1w: false
          - board: pico1w
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-tcp"
            flash-max: 2088960
            flash-desc: "2 MB"
            pico1w: true
          - board: pico2w-ws
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-websocket"
            flash-max: 4186112
            flash-desc: "4 MB"
            pico1w: false
          - board: pico1w-ws
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-websocket"
            flash-max: 2088960
            flash-desc: "2 MB"
            pico1w: true
          - board: pico2w-mqtt
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-mqtt"
            flash-max: 4186112
            flash-desc: "4 MB"
            pico1w: false
          - board: pico2w-postcard
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-tcp,codec-postcard"
            flash-max: 4186112
            flash-desc: "4 MB"
            pico1w: false
          - board: pico1w-mqtt
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-mqtt"
            flash-max: 2088960
            flash-desc: "2 MB"
            pico1w: true
          - board: pico1w-postcard
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-tcp,codec-postcard"
            flash-max: 2088960
            flash-desc: "2 MB"
            pico1w: true
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - name: Start sccache or disable
        run: sccache --start-server 2>/dev/null || echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Build firmware (release)
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo-features }}

      - name: Verify firmware fits in flash
        run: |
          FLASH_MAX=${{ matrix.flash-max }}

          FIRMWARE=${CARGO_TARGET_DIR}/${{ matrix.target }}/release/pico-socketeer
          TEXT=$(size "$FIRMWARE" | awk 'NR==2 {print $1}')
          DATA=$(size "$FIRMWARE" | awk 'NR==2 {print $2}')
          USED=$(( TEXT + DATA ))
          REMAINING=$(( FLASH_MAX - USED ))

          echo "Flash budget : ${FLASH_MAX} bytes (${{ matrix.flash-desc }} − 8 KB credentials)"
          echo "Firmware size: ${USED} bytes  (text=${TEXT}, data=${DATA})"
          echo "Remaining    : ${REMAINING} bytes"

          printf '| Board | Used (bytes) | Budget (bytes) | Remaining | Status |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '|-------|-------------|----------------|-----------|--------|\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$USED" -gt "$FLASH_MAX" ]; then
            printf '| %s | %s | %s | %s | :x: FAIL |\n' \
              "${{ matrix.board }}" "$USED" "$FLASH_MAX" "$REMAINING" >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: firmware exceeds flash capacity by $(( USED - FLASH_MAX )) bytes"
            exit 1
          else
            printf '| %s | %s | %s | %s | :white_check_mark: ok |\n' \
              "${{ matrix.board }}" "$USED" "$FLASH_MAX" "$REMAINING" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-elf-${{ matrix.board }}
          path: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/pico-socketeer
          retention-days: 5

  # ── Release (only on version tags) ─────────────────────────────────
  # ELFs are produced by build-firmware (uploaded as GHA artifacts).
  # elf2uf2-rs is installed in the deps Docker image (base-tools stage).
  release:
    name: Release UF2
    needs: [build-pico2w, build-firmware]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-pico2w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-elf-pico2w
          path: elf-pico2w

      - uses: actions/download-artifact@v8
        with:
          name: firmware-elf-pico1w
          path: elf-pico1w

      - name: Convert pico2w ELF to UF2
        run: elf2uf2-rs elf-pico2w/pico-socketeer pico-socketeer-pico2w.uf2

      - name: Convert pico1w ELF to UF2
        run: elf2uf2-rs elf-pico1w/pico-socketeer pico-socketeer-pico1w.uf2

      - name: Upload UF2s to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pico-socketeer-pico2w.uf2
            pico-socketeer-pico1w.uf2
