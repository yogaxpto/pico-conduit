name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: /cache/target

jobs:
  # ── Build CI Docker image: pico2w variant (thumbv8m + host deps) ────
  build-pico2w:
    name: Build CI Image (pico2w)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}/ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Expose GHA cache service URL/token so sccache inside BuildKit can
      # read/write the Actions cache.  actions/cache injects these env vars
      # automatically; buildx needs them forwarded as build secrets.
      - name: Expose GitHub Actions cache env
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile.ci
          target: final-pico2w
          push: true
          # Always push a SHA-pinned tag (used by downstream jobs via outputs.image).
          # Push `latest` only on master so concurrent PR builds don't race on it.
          tags: |
            ghcr.io/${{ github.repository }}/ci:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && format('ghcr.io/{0}/ci:latest', github.repository) || '' }}
          cache-from: type=gha,scope=pico2w
          cache-to: type=gha,mode=max,scope=pico2w
          secrets: |
            actions_cache_url=${{ env.ACTIONS_CACHE_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}

  # ── Build CI Docker image: pico1w variant (thumbv6m deps only) ──────
  # Runs in parallel with build-pico2w on a separate runner, halving the
  # wall time spent in the image-build phase.
  build-pico1w:
    name: Build CI Image (pico1w)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}/ci:pico1w-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose GitHub Actions cache env
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'] || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'] || '');

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile.ci
          target: final-pico1w
          push: true
          tags: ghcr.io/${{ github.repository }}/ci:pico1w-${{ github.sha }}
          cache-from: type=gha,scope=pico1w
          cache-to: type=gha,mode=max,scope=pico1w
          secrets: |
            actions_cache_url=${{ env.ACTIONS_CACHE_URL }}
            actions_runtime_token=${{ env.ACTIONS_RUNTIME_TOKEN }}

  # ── Host test binary compilation (fans out from build) ────────────
  # Compiles host test binaries on a dedicated runner so host-test only runs
  # pre-compiled binaries (no source compilation at test time).
  host-build:
    name: Build host test binaries
    needs: [build-pico2w]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}/ci:host-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/Dockerfile.ci.host
          push: true
          tags: ghcr.io/${{ github.repository }}/ci:host-${{ github.sha }}
          build-args: DEPS_IMAGE=${{ needs.build-pico2w.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Fast checks (run in parallel after build) ─────────────────────
  lint:
    name: Lint (${{ matrix.board }})
    needs: [build-pico2w, build-pico1w]
    runs-on: ubuntu-latest
    container:
      image: >-
        ${{ matrix.pico1w == true
            && needs.build-pico1w.outputs.image
            || needs.build-pico2w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico2w
            target: thumbv8m.main-none-eabihf
            cargo-features: ""
            pico1w: false
          - board: pico1w
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-tcp"
            pico1w: true
          - board: pico2w-ws
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-websocket"
            pico1w: false
          - board: pico1w-ws
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-websocket"
            pico1w: true
          - board: pico2w-mqtt
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-mqtt"
            pico1w: false
          - board: pico1w-mqtt
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-mqtt"
            pico1w: true
          - board: pico2w-postcard
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-tcp,codec-postcard"
            pico1w: false
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve host target
        id: host
        run: |
          . /etc/cargo-env
          echo "triple=${HOST_TRIPLE}" >> "$GITHUB_OUTPUT"

      - name: Format check
        if: matrix.board == 'pico2w'
        run: cargo fmt --all --check

      - name: Transport exclusivity guard
        if: matrix.board == 'pico2w'
        run: |
          cargo check --no-default-features \
            --features embedded,pico2w,transport-tcp,transport-websocket 2>&1 \
            | grep -q "mutually exclusive"

      - name: Clippy (embedded firmware)
        run: cargo clippy --release --target ${{ matrix.target }} ${{ matrix.cargo-features }} -- -D warnings

      - name: Clippy (client crate)
        if: matrix.board == 'pico2w'
        run: cargo clippy -p pico-socketeer-client --target ${{ steps.host.outputs.triple }} -- -D warnings

  host-test:
    name: Test (${{ matrix.board }})
    needs: [host-build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.host-build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico2w
            cargo-features: "--features pico2w"
          - board: pico1w
            cargo-features: "--features pico1w"
    defaults:
      run:
        working-directory: /src
    steps:
      - name: Resolve host target
        id: host
        run: |
          . /etc/cargo-env
          echo "triple=${HOST_TRIPLE}" >> "$GITHUB_OUTPUT"

      - name: Host tests (board-independent)
        if: matrix.board == 'pico2w'
        run: cargo test --test host --no-default-features --target ${{ steps.host.outputs.triple }}

      - name: Board-specific tests (${{ matrix.board }})
        run: cargo test --test host --no-default-features ${{ matrix.cargo-features }} --target ${{ steps.host.outputs.triple }}

      - name: Client crate tests
        if: matrix.board == 'pico2w'
        run: cargo test -p pico-socketeer-client --target ${{ steps.host.outputs.triple }}

  # ── Firmware build (gates on lint + tests passing) ─────────────────
  # Source is not pre-compiled in the deps image; cargo build --release here
  # does the full LTO compilation. Seven matrix items run in parallel, each on
  # a dedicated runner.
  build-firmware:
    name: Build Firmware (${{ matrix.board }})
    needs: [build-pico2w, build-pico1w, lint, host-test]
    runs-on: ubuntu-latest
    container:
      image: >-
        ${{ matrix.pico1w == true
            && needs.build-pico1w.outputs.image
            || needs.build-pico2w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico2w
            target: thumbv8m.main-none-eabihf
            cargo-features: ""
            flash-max: 4186112
            flash-desc: "4 MB"
            pico1w: false
          - board: pico1w
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-tcp"
            flash-max: 2088960
            flash-desc: "2 MB"
            pico1w: true
          - board: pico2w-ws
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-websocket"
            flash-max: 4186112
            flash-desc: "4 MB"
            pico1w: false
          - board: pico1w-ws
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-websocket"
            flash-max: 2088960
            flash-desc: "2 MB"
            pico1w: true
          - board: pico2w-mqtt
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-mqtt"
            flash-max: 4186112
            flash-desc: "4 MB"
            pico1w: false
          - board: pico2w-postcard
            target: thumbv8m.main-none-eabihf
            cargo-features: "--no-default-features --features embedded,pico2w,transport-tcp,codec-postcard"
            flash-max: 4186112
            flash-desc: "4 MB"
            pico1w: false
          - board: pico1w-mqtt
            target: thumbv6m-none-eabi
            cargo-features: "--no-default-features --features embedded,pico1w,transport-mqtt"
            flash-max: 2088960
            flash-desc: "2 MB"
            pico1w: true
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - name: Build firmware (release)
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo-features }}

      - name: Verify firmware fits in flash
        run: |
          FLASH_MAX=${{ matrix.flash-max }}

          FIRMWARE=${CARGO_TARGET_DIR}/${{ matrix.target }}/release/pico-socketeer
          TEXT=$(size "$FIRMWARE" | awk 'NR==2 {print $1}')
          DATA=$(size "$FIRMWARE" | awk 'NR==2 {print $2}')
          USED=$(( TEXT + DATA ))
          REMAINING=$(( FLASH_MAX - USED ))

          echo "Flash budget : ${FLASH_MAX} bytes (${{ matrix.flash-desc }} − 8 KB credentials)"
          echo "Firmware size: ${USED} bytes  (text=${TEXT}, data=${DATA})"
          echo "Remaining    : ${REMAINING} bytes"

          printf '| Board | Used (bytes) | Budget (bytes) | Remaining | Status |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '|-------|-------------|----------------|-----------|--------|\n' >> "$GITHUB_STEP_SUMMARY"
          if [ "$USED" -gt "$FLASH_MAX" ]; then
            printf '| %s | %s | %s | %s | :x: FAIL |\n' \
              "${{ matrix.board }}" "$USED" "$FLASH_MAX" "$REMAINING" >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: firmware exceeds flash capacity by $(( USED - FLASH_MAX )) bytes"
            exit 1
          else
            printf '| %s | %s | %s | %s | :white_check_mark: ok |\n' \
              "${{ matrix.board }}" "$USED" "$FLASH_MAX" "$REMAINING" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-elf-${{ matrix.board }}
          path: ${{ env.CARGO_TARGET_DIR }}/${{ matrix.target }}/release/pico-socketeer
          retention-days: 5

  # ── Release (only on version tags) ─────────────────────────────────
  # ELFs are produced by build-firmware (uploaded as GHA artifacts).
  # elf2uf2-rs is installed in the deps Docker image (base-tools stage).
  release:
    name: Release UF2
    needs: [build-pico2w, build-firmware]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-pico2w.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-elf-pico2w
          path: elf-pico2w

      - uses: actions/download-artifact@v4
        with:
          name: firmware-elf-pico1w
          path: elf-pico1w

      - name: Convert pico2w ELF to UF2
        run: elf2uf2-rs elf-pico2w/pico-socketeer pico-socketeer-pico2w.uf2

      - name: Convert pico1w ELF to UF2
        run: elf2uf2-rs elf-pico1w/pico-socketeer pico-socketeer-pico1w.uf2

      - name: Upload UF2s to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pico-socketeer-pico2w.uf2
            pico-socketeer-pico1w.uf2
